<div class="selfie-onboard-container">
    <app-loading-overlay></app-loading-overlay>
    <app-notification-stack></app-notification-stack>
    <div class="card-container">
        <div class="logo-container">
            <img src="assets/logo/logo.png" alt="AlbumFlux Logo" class="logo-img" />
        </div>


        <section class="screen-card success-card">
            <div class="success-illustration">
                <span class="check-icon">✓</span>
            </div>

            <h1 class="title">Selfie Verified.</h1>

            <div class="summary-grid">
                <p><strong>Event</strong><span>{{ eventData.eventName || eventname }}</span></p>
                <p><strong>Location</strong><span>{{ eventData.location || location }}</span></p>
                <p><strong>Name</strong><span>{{ username ||  userData.name }}</span></p>
                <p><strong>Email</strong><span>{{ email ||  userData.email }}</span></p>
            </div>

            <div class="selfie-preview" *ngIf="previewImage">
                <img [src]="previewImage" alt="Your selfie" />
            </div>

            <div class="actions vertical">
                <button class="btn primary" type="button" (click)="viewAllSubmissions()">
                    View all submissions
                </button>
                <button class="btn outline" type="button" (click)="retakeSelfie()">
                    Retake selfie
                </button>
            </div>

            <div class="marketing-footer">
                <p class="marketing-footer-text">Powered by <strong>AlbumFlux</strong> — Your memories, beautifully preserved</p>
            </div>
        </section>
    </div>
</div>
