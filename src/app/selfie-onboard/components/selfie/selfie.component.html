<div class="selfie-onboard-container">
    <app-loading-overlay></app-loading-overlay>
    <app-notification-stack></app-notification-stack>

    <!-- Top Bar -->
    <div class="top-bar">
        <button class="back-btn" type="button" (click)="backToLogin()" aria-label="Go back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>
        <h1 class="top-title">Take a Selfie</h1>
        <button class="help-btn" type="button" (click)="showHelp()" aria-label="Help">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>
            </svg>
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Optional Mobile Number Input -->
        <div class="mobile-input-section" *ngIf="showMobileInput">
            <div class="floating-input">
                <input
                    type="tel"
                    id="mobileNumber"
                    placeholder=" "
                    [(ngModel)]="mobileNumber"
                    maxlength="15"
                    pattern="[0-9+\-\s()]*"
                />
                <label for="mobileNumber">Mobile Number (Optional)</label>
            </div>
        </div>

        <!-- Camera Preview Area -->
        <div class="camera-section">
            <div class="camera-wrapper">
                <div class="video-container">
                    <video
                        #videoElement
                        autoplay
                        muted
                        playsinline
                        class="video-stream"
                        [style.display]="previewImage ? 'none' : 'block'"
                    ></video>
                    <img
                        *ngIf="previewImage"
                        [src]="previewImage"
                        alt="Captured selfie"
                        class="preview-image"
                    />

                    <!-- Face Alignment Guide (Oval Shape) -->
                    <div *ngIf="!previewImage" class="face-guide" [ngClass]="{'aligned': isFaceAligned}">
                        <div class="guide-oval"></div>
                        <div class="guide-center-dot"></div>
                    </div>

                    <!-- Status Indicator -->
                    <div *ngIf="!previewImage" class="status-indicator" [ngClass]="{'success': isFaceAligned}">
                        <div class="status-icon-wrapper">
                            <svg *ngIf="isFaceAligned" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            <svg *ngIf="!isFaceAligned" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="12" y1="8" x2="12" y2="12"/>
                                <line x1="12" y1="16" x2="12.01" y2="16"/>
                            </svg>
                        </div>
                        <span class="status-text">
                            <span *ngIf="isFaceAligned">Perfect! Ready to capture</span>
                            <span *ngIf="!isFaceAligned">Center your face in the frame</span>
                        </span>
                    </div>
                </div>

                <!-- Hidden Canvas for Capture -->
                <canvas #canvasElement style="display:none;"></canvas>
            </div>

            <!-- Thumbnail Preview (shown after capture) -->
            <!-- <div class="thumbnail-preview" *ngIf="previewImage">
                <img [src]="previewImage" alt="Preview" />
                <div class="thumbnail-badge">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
            </div> -->
        </div>

        <!-- Action Buttons -->
        <div class="action-section" [class.captured]="previewImage">
            <!-- Capture Button (shown only before capture) -->
            <button
                *ngIf="!previewImage"
                class="btn-capture"
                type="button"
                (click)="capture()"
                [disabled]="!videoReady || isSubmitting"
                [class.loading]="isSubmitting"
            >
                <span class="btn-ripple" *ngIf="!isSubmitting"></span>
                <span class="btn-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6M23 12h-6m-6 0H1"/>
                    </svg>
                </span>
                <span class="btn-text">Capture</span>
            </button>

            <!-- Post-Capture Buttons (shown after capture) -->
            <div *ngIf="previewImage" class="post-capture-actions">
                <button
                    class="btn-retake"
                    type="button"
                    (click)="retake()"
                    [disabled]="isSubmitting"
                >
                    <span class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </span>
                    <span class="btn-text">Retake</span>
                </button>

                <button
                    class="btn-submit"
                    type="button"
                    (click)="submit()"
                    [disabled]="isSubmitting"
                    [class.loading]="isSubmitting"
                >
                    <span class="btn-ripple" *ngIf="!isSubmitting"></span>
                    <span class="btn-spinner" *ngIf="isSubmitting">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="31.416" stroke-dashoffset="31.416" fill="none" opacity="0.3"/>
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="31.416" stroke-dashoffset="23.562" fill="none">
                                <animate attributeName="stroke-dashoffset" dur="1s" values="31.416;0;31.416" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </span>
                    <span class="btn-icon" *ngIf="!isSubmitting">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </span>
                    <span class="btn-text">
                        <span *ngIf="!isSubmitting">Submit</span>
                        <span *ngIf="isSubmitting">Submitting...</span>
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
